apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-sidecar
spec:
  mode: sidecar
  image: otel/opentelemetry-collector-contrib:0.165.0
  env:
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi
  config:
    receivers:
      otlp:
        protocols:
          grpc: {}
          http: {}

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 70
        spike_limit_percentage: 30
      metricstransform:
        transforms:
          - include: .+
            match_type: regexp
            action: update
            operations:
              - action: add_label
                new_label: k8s.cluster.name
                new_value: Frank-Rwanda
              - action: add_label
                new_label: dt.kubernetes.config.id
                new_value: 8dce645d-e6a7-47ed-ad52-a41e40040d88
              - action: update_label
                label: system_uuid
                new_label: dt.kubernetes.node.system_uuid
      batch:
        send_batch_size: 800
        send_batch_max_size: 1000
        timeout: 30s

    exporters:
      debug:
        verbosity: basic
      otlp:
        endpoint: oteld-collector.otel.svc.cluster.local:4317
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp, debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, metricstransform, batch]
          exporters: [otlp]
